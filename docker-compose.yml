services:
  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: /data/cyberedge.db
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - leads:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  leads:
