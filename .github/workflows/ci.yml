name: Verify and publish CyberEdge Gym

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint, format, type check, and test
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy .
          pytest --cov --cov-report=term-missing
      - name: Audit locked Python dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Build runtime image
        run: |
          docker compose config --quiet
          docker build --tag cyberedgegym:ci backend
          docker run --rm --entrypoint python cyberedgegym:ci -c 'import os; assert os.getuid() == 10001'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Verify production build
        run: npm run build -- --production
        env:
          CYBEREDGE_API_URL: https://api.example.test

  deploy-pages:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -- --production
        env:
          CYBEREDGE_API_URL: ${{ vars.CYBEREDGE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
